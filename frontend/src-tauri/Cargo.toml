[package]
name = "mail-assistant-admin"
version = "0.1.0"
description = "Mail Assistant admin app (desktop)"
edition = "2021"

[lib]
name = "mail_assistant_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
