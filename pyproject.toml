[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-mail-assistant"
version = "0.1.0"
description = "A confirmation-first MCP server that enables AI assistants to draft and send emails through any SMTP provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Politzer" }]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
]

[project.scripts]
outbox-mcp = "outbox_mcp.server:main"
outbox-mcp-http = "outbox_mcp.http_server:main"
outbox-admin = "outbox_mcp.admin_cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "aiosmtpd>=1.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
