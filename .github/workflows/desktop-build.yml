# Builds the desktop app for macOS, Windows and Linux. It runs only when started by hand
# (Actions tab, "Run workflow"), so nothing is built or published by accident.
name: Desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
        env:
          ADMIN_PYTHON: ${{ github.workspace }}/.venv/bin/python

  build:
    name: Build ${{ matrix.label }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { label: macOS (Intel), os: macos-13, args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { label: Linux, os: ubuntu-22.04, args: "", target: "" }
          - { label: Windows, os: windows-latest, args: "", target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: frontend
      - name: Rust tests
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml
      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: mail-assistant-${{ runner.os }}-${{ runner.arch }}
          path: |
            frontend/src-tauri/target/**/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/**/release/bundle/msi/*.msi
            frontend/src-tauri/target/**/release/bundle/nsis/*.exe
            frontend/src-tauri/target/**/release/bundle/deb/*.deb
            frontend/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
